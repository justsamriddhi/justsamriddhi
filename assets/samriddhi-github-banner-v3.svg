<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Samriddhi — AI/ML undergraduate</title>
<desc id="desc">A chic, dark technical GitHub banner with a clear Samriddhi wordmark, subtle grid and animated cyan details.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1017"/><stop offset="1" stop-color="#111b25"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#69e0d0"/><stop offset="1" stop-color="#91bfff"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b8d2df" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
  .cursor{animation:blink 1.1s steps(2,start) infinite}
  .pulse{animation:pulse 3.6s ease-in-out infinite}
  .scan{animation:scan 6s ease-in-out infinite}
  @keyframes blink{to{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(108px);opacity:.8}}
  @media(prefers-reduced-motion:reduce){.cursor,.pulse,.scan{animation:none}}
</style>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<rect x="18" y="18" width="1164" height="324" rx="12" fill="none" stroke="#b9c9d4" stroke-opacity=".22"/>
<!-- small identity line -->
<text x="64" y="66" class="mono" font-size="14" letter-spacing="3" fill="#8fa5b4">PORTFOLIO <tspan fill="#3c5968">/</tspan> AI &amp; SOFTWARE</text>
<circle cx="65" cy="104" r="3" fill="#75e3d2" filter="url(#glow)"/>
<text x="88" y="116" class="mono" font-size="14" letter-spacing="2.4" fill="#75e3d2">HELLO, I'M</text>
<!-- name: deliberately dominant and unobstructed -->
<text x="60" y="218" class="sans" font-size="104" font-weight="650" letter-spacing="-5" fill="#f2f6f7">Samriddhi</text>
<rect x="64" y="244" width="116" height="3" rx="2" fill="url(#accent)"/>
<text x="64" y="282" class="sans" font-size="22" font-weight="450" fill="#bdcbd3">AI/ML undergraduate <tspan fill="#66808d">·</tspan> building with intelligent systems</text>
<text x="64" y="316" class="mono" font-size="13" letter-spacing="1.4" fill="#8297a3">PYTHON   /   LLMs   /   AUTOMATION   /   PSYCHOLOGY</text>
<!-- restrained technical motif on right -->
<g transform="translate(850 76)">
  <path d="M0 44H82V0H176M82 44V126H214M176 0V72H258" fill="none" stroke="#6b8b9a" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M0 172H62V126H214V172H258" fill="none" stroke="#6b8b9a" stroke-opacity=".28" stroke-width="1.5"/>
  <g fill="#75e3d2"><circle cx="82" cy="44" r="4"/><circle cx="176" cy="0" r="4"/><circle cx="214" cy="126" r="4"/><circle cx="62" cy="172" r="4"/></g>
  <g fill="#9db2bd" fill-opacity=".35"><circle cx="0" cy="44" r="2.5"/><circle cx="258" cy="72" r="2.5"/><circle cx="258" cy="172" r="2.5"/><circle cx="176" cy="72" r="2.5"/></g>
  <g class="pulse" fill="none" stroke="url(#accent)" stroke-width="1.4"><circle cx="176" cy="72" r="18"/><circle cx="176" cy="72" r="31" stroke-opacity=".4"/></g>
  <path class="scan" d="M-8 88H268" stroke="#75e3d2" stroke-width="1" stroke-opacity=".7"/>
  <text x="0" y="218" class="mono" font-size="11" letter-spacing="2" fill="#6f8794">IDEAS → SYSTEMS → IMPACT</text>
</g>
<text x="1136" y="318" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#526875">01 / 01</text>
<rect class="cursor" x="550" y="264" width="2" height="22" fill="#75e3d2" opacity=".9"/>
</svg>
